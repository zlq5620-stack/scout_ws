amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: map
    odom_frame_id: odom
    # AMCL is planar. Use the ground projection, while base_link is 0.079 m high.
    base_frame_id: base_footprint
    robot_model_type: nav2_amcl::DifferentialMotionModel
    scan_topic: /scan
    tf_broadcast: true
    transform_tolerance: 0.5
    set_initial_pose: false
    # Humble converts this to a duration using 1/rate; zero causes configure failure.
    save_pose_rate: 0.5
    min_particles: 500
    max_particles: 2000
    max_beams: 100
    laser_model_type: likelihood_field
    laser_min_range: 0.35
    laser_max_range: 12.0
    laser_likelihood_max_dist: 2.0
    z_hit: 0.8
    z_rand: 0.2
    sigma_hit: 0.2
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.3
    alpha4: 0.2
    alpha5: 0.2
    update_min_d: 0.05
    update_min_a: 0.05
    resample_interval: 1
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
