amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    robot_model_type: 'nav2_amcl::DifferentialMotionModel'
    scan_topic: /scan
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    max_beams: 80
    min_particles: 300
    max_particles: 1500
    update_min_d: 0.10
    update_min_a: 0.10
    transform_tolerance: 1.0
    tf_broadcast: true
    resample_interval: 1
    pf_err: 0.05
    pf_z: 0.99
    z_hit: 0.5
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1
