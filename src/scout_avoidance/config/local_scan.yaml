local_obstacle_cloud_to_scan:
  ros__parameters:
    use_sim_time: false
    target_frame: livox_level
    transform_tolerance: 0.05
    # Separate from AMCL scan: observe 5 to 75 cm above assumed level ground.
    min_height: -0.355
    max_height: 0.345
    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    angle_increment: 0.008726646259971648
    scan_time: 0.10
    range_min: 0.15
    range_max: 12.0
    use_inf: true
